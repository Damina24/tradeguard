name: tradeguard
description: "TradeGuard - Forex Signals. Prop drawdown guard, XAUUSD alerts & trading journal for MT5."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  collection: ^1.19.0
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  csv: ^6.0.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  purchases_flutter: ^8.1.2
  logger: ^2.4.0
  # SHA-256 of the Apple sign-in nonce (see SocialAuthService).
  crypto: ^3.0.6
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11
  # Test-only: lets broker_webview_screen_test.dart build a fake WebViewPlatform
  # (WebViewController asserts a platform is registered before it constructs).
  webview_flutter_platform_interface: ^2.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
