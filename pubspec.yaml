name: tradeguard
description: "TradeGuard - Forex Signals. Prop drawdown guard, XAUUSD alerts & trading journal for MT5."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  collection: ^1.19.0
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  csv: ^6.0.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  logger: ^2.4.0
  # SHA-256 of the Apple sign-in nonce (see SocialAuthService).
  crypto: ^3.0.6
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11
  # Test-only: lets broker_webview_screen_test.dart build a fake WebViewPlatform
  # (WebViewController asserts a platform is registered before it constructs).
  webview_flutter_platform_interface: ^2.10.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ---------------------------------------------------------------------------
# Branding generation (TradeGuard launcher icons + native splash).
# Primary background = AppColors.background = Color(0xFF0A0E17).
# Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0E17"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#0A0E17"
  image: "assets/images/splash_logo.png"
  # `fill` scales the logo up to fill the drawable while preserving the
  # source bitmap's aspect (no stretch). `center` (the default) renders it
  # at intrinsic size, which is why the logo looked tiny on-device.
  android_gravity: fill
  # `scaleAspectFill` is the iOS counterpart: fills the LaunchImage view
  # while keeping aspect ratio (cropping overflow instead of distorting).
  ios_content_mode: scaleAspectFill
  fullscreen: true
  android_12:
    color: "#0A0E17"
    image: "assets/images/splash_logo.png"
    icon_background_color: "#0A0E17"
  ios: true
