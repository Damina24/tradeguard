name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Distribution is GitHub APK sideload (Flutterwave billing, no store SDK): CI
# builds a release APK from GitHub Secrets — never from a committed env file
# (env/*.json is git-ignored; real keys live only in Secrets). See
# docs/BACKEND_DEPLOY.md §7 for the secret list.
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Format gate removed by project decision: formatter churn across SDK
      # versions is not a CI gate. Gates are: analyze, test, node parity suite.
      - run: flutter analyze
      - run: flutter test --exclude-tags=disabled
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node supabase/functions/copy-signal/copy_signal_test.ts
      - run: node supabase/functions/delete-account/delete_account_test.ts
      - run: node supabase/functions/flutterwave-webhook/flutterwave_webhook_test.ts

  android-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
