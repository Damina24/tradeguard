# Supabase local config (Phase 0). Fill project ref after `supabase link`.
project_id = "tradeguard"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# guard-check and sync-trades are invoked by pg_cron, which presents the service_role key as a
# bearer token (migration 0004 + docs/BACKEND_DEPLOY.md). verify_jwt stays on so the platform
# rejects anonymous calls; the function additionally requires the service-role key itself.
[functions.guard-check]
verify_jwt = true

[functions.sync-trades]
verify_jwt = true

[functions.meta-connect]
verify_jwt = true

# sync-account-data is user-facing (a trader opens the Guard dashboard), so it uses
# the ai-review / market-bars shape: the platform verifies the JWT and the function
# additionally resolves the caller with GoTrue from their own bearer token. It must
# NOT use the service-role gate that guard-check / sync-trades use — those are cron
# jobs with no user session. METAAPI_TOKEN is read server-side only, never returned.
[functions.sync-account-data]
verify_jwt = true

[functions.ai-review]
verify_jwt = true

# market-bars is user-facing (a trader opens the replay), so it uses the `ai-review` shape: the platform
# verifies the JWT and the function additionally resolves the caller with GoTrue. It must NOT use the
# service-role gate that guard-check / sync-trades use — those are cron jobs with no user session.
# TWELVEDATA_KEY is a metered credential and lives only in this function's environment, never in the app.
[functions.market-bars]
verify_jwt = true

[functions.ai-analyze-chart]
verify_jwt = true

[functions.copy-signal]
verify_jwt = true

# delete-account is user-facing (a trader deletes their own account from Settings). Same shape as
# copy-signal / ai-review: the platform verifies the JWT and the function additionally resolves the
# caller with GoTrue from their own bearer token. Every delete is scoped to that verified uid.
[functions.delete-account]
verify_jwt = true

[functions.purge-account]
verify_jwt = true

# paystack-webhook is called by Paystack's servers (not the app), so it carries no Supabase
# JWT — verify_jwt must be OFF or the platform would reject every webhook. Authenticity is
# the HMAC-SHA512 `x-paystack-signature` header, verified inside the function against
# PAYSTACK_SECRET_KEY. It writes profiles.is_premium with the service role (RLS is read-only
# for users, migration 0012).
[functions.paystack-webhook]
verify_jwt = false
